<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://kit.fontawesome.com/0e53af926d.js" crossorigin="anonymous"></script>
    <title>Edit Product</title>
</head>
<body style="background-color: #e3e6f3;">
    <h1>Edit Product</h1>
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <label for="product_name">Product Name:</label>
        <input type="text" name="product_name" value="{{ product.product_name }}" required>
        
        <label for="brand_name">Brand Name:</label>
        <input type="text" name="brand_name" value="{{ product.brand_name }}" required>
        
        <label for="product_price">Price:</label>
        <input type="number" name="product_price" value="{{ product.price }}" required>
        
        <label for="product_image">Image:</label>
        <input type="file" name="product_image">
        
        <button type="submit">Update</button>
    </form>
    
    {% if form.errors %}
        <div style="color: red">
            {% for field, errors in form.errors.items %}
                <p>{{ field }}: {{ errors|join:", " }}</p>
            {% endfor %}
        </div>
    {% endif %}
    
    <a href="{% url 'admin_page' %}" class="fa-solid fa-arrow-left" style="font-size:small; font-weight: 700; text-decoration: none; ">  Back to Admin Page</a>
</body>
</html>




<style>
    /* General Styles */
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 20px;
    background-color: #f4f4f4;
    margin-left: 30%;
}

h1 {
    color: #333;
}

/* Form Styles */
form {
    background: #fff;
    padding: 20px;
    border-radius: 5px;
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    margin-bottom: 20px;
    width: 50%;
  
}

label {
    display: block;
    margin-bottom: 8px;
    font-weight: bold;
}

input[type="text"],
input[type="number"],
textarea,
input[type="file"] {
    width: 100%;
    padding: 10px;
    margin-bottom: 15px;
    border: 1px solid #ddd;
    border-radius: 4px;
    box-sizing: border-box;
}

button {
    background-color: #5cb85c;
    color: white;
    border: none;
    padding: 10px 15px;
    border-radius: 4px;
    cursor: pointer;
}

button:hover {
    background-color: #4cae4c;
}

/* Error Styles */
div {
    margin: 15px 0;
}

div[style*="color: red"] {
    color: red;
}

</style>
