

<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <title>Admin Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <script
      src="https://kit.fontawesome.com/0e53af926d.js"
      crossorigin="anonymous"
    ></script>
</head>
<body style="background-color: #e3e6f3;">

<header>
    <div id="header">
        <div class="header-logo">
            <a href="{% url 'home' %}"><img src="{% static 'images/logo1.png' %}" alt="Logo"></a>
        </div>
        <div class="header-list">
            <nav class="header-list-nav">
                <ul>
                    
                    <li><a href="{% url 'home' %}">Back</a></li>
                </ul>
            </nav>
            
        </div>
    </div>
</header>

<div class="container" >
    <!-- Admin Login Form Section -->
    <div class="signup-section">
        <div class="header">
            <span style="color: #1a1a1a;">Admin Login</span>
            <p>Login now as an Admin.</p>
        </div>
        <form id="admin-login-form" onsubmit="return validateAdminLogin()">
            <input type="text" id="username" placeholder="Enter Username" required />
            <input type="password" id="password" placeholder="Enter Password" required />
            <input type="submit" value="Login" />
            <span>Leading with Precision and Care.</span>
        </form>
    </div>

    <!-- Image Section -->
    <div class="image-section">
        <img src="{% static 'images/banner/admin.png' %}" alt="Admin Login Image">
    </div>
</div>

<script>
    // Hardcoded username and password for admin login
    const validUsername = "admin";
    const validPassword = "admin";

    function validateAdminLogin() {
        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;

        if (username === validUsername && password === validPassword) {
           
            window.location.href = "{% url 'admin_page' %}";
            return false; // Prevent actual form submission (since we are using client-side validation)
        } else {
            alert("Invalid username or password!");
            return false; // Prevent form submission on failure
        }
    }
</script>

</body>
</html>
