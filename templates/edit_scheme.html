<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://kit.fontawesome.com/0e53af926d.js" crossorigin="anonymous"></script>
    <title>Edit Scheme</title>
</head>
<body style="background-color: #e3e6f3;">
    
    <h1>Edit Scheme</h1>
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <label for="scheme_name">Scheme Name:</label>
        <input type="text" name="scheme_name" value="{{ scheme.scheme_name }}" required>
        
        <label for="ministry">Ministry:</label>
        <input type="text" name="ministry" value="{{ scheme.ministry }}" required>
        
        <label for="scheme_summary">Scheme Summary:</label>
        <textarea name="scheme_summary" required>{{ scheme.scheme_summary }}</textarea>
        
        <label for="scheme_link">Scheme Link:</label>
        <input type="text" name="scheme_link" value="{{ scheme.scheme_link }}" required>
        
        <label for="scheme_image">Image:</label>
        <input type="file" name="scheme_image">
        
        <button type="submit">Update Scheme</button>
    </form>

    {% if form.errors %}
        <div style="color: red">
            {% for field, errors in form.errors.items %}
                <p>{{ field }}: {{ errors|join:", " }}</p>
            {% endfor %}
        </div>
    {% endif %}
    <a href="{% url 'admin_page' %}" class="fa-solid fa-arrow-left" style="font-size:small; font-weight: 700; text-decoration: none; ">  Back to Admin Page</a>
</body>
</html>





<style>
    
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 20px;
        background-color: #f4f4f4;
        margin-left: 30%;
    }
    
    h1 {
        color: #333;
    }
    
    /* Form Styles */
    form {
        background: #fff;
        padding: 20px;
        border-radius: 5px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        margin-bottom: 20px;
        width: 50%;
    }
    
    label {
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
    }
    
    input[type="text"],
    input[type="number"],
    textarea,
    input[type="file"] {
        width: 100%;
        padding: 10px;
        margin-bottom: 15px;
        border: 1px solid #ddd;
        border-radius: 4px;
        box-sizing: border-box;
    }
    
    textarea{
        max-width: 100%;
        /* height: 20%; */
    }


    button {
        background-color: #5cb85c;
        color: white;
        border: none;
        padding: 10px 15px;
        border-radius: 4px;
        cursor: pointer;
    }
    
    button:hover {
        background-color: #4cae4c;
    }
    
    /* Error Styles */
    div {
        margin: 15px 0;
    }
    
    div[style*="color: red"] {
        color: red;
    }
    
</style>
