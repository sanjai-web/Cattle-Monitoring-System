<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {% load static %}

  <!-- Uncomment the stylesheet link if needed -->
  <!-- <link rel="stylesheet" href="{% static 'css/style.css' %}"> -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

  <script
    src="https://kit.fontawesome.com/0e53af926d.js"
    crossorigin="anonymous"
  ></script>
  <title>User Login</title>
  
</head>
<body style="background-color: #f4f4f7;">

   <!-- Header -->
   <header>
    <div id="header">
      <div class="header-logo">
        <a>
          <img src="{% static 'images/logo1.png' %}" alt="Logo" />
        </a>
      </div>
      <div class="header-list">
        <nav class="header-list-nav">
          <ul>
           
            <li><a style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;" href="{% url 'adminlogin' %} ">Admin</a></li>
            
          </ul>
        </nav>
        
      </div>
    </div>
  </header>


<div class="container">
  <!-- Image Section -->
  <div class="image-section">
    <img src="{% static 'images/banner/loginback.png' %}" alt="Login Image">
  </div>

  <!-- Form Section -->
  <div class="form-container">
    <p class="title">Login</p>
    <!-- Form posts to the login view -->
    <form class="form" method="post" action="{% url 'login' %}">
      {% csrf_token %}
      <div class="input-group">
        <label for="username">Email</label>
        <input type="text" name="username" id="username" placeholder="" required>
      </div>
      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" name="password" id="password" placeholder="" required>
        <div class="forgot">
          <a rel="noopener noreferrer" href="#">Forgot Password?</a>
        </div>
      </div>
      <button class="sign" type="submit">Sign in</button>
    </form>

    <!-- Display error messages, if any -->
    {% if messages %}
    <ul>
      {% for message in messages %}
      <li>{{ message }}</li>
      {% endfor %}
    </ul>
    {% endif %}
<br>
    <p class="signup">Don't have an account?
      <a rel="noopener noreferrer" href="{% url 'signup' %}">Sign up</a>
    </p>
  </div>
</div>
</body>
</html>



<style>


/* header styles */

#header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background-color: #e3e6f3;
    padding: 20px 80px;
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.06);
    z-index: 999;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
  }

  .header-list {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .header-list-nav ul {
    display: flex;
  }
  .header-list-nav ul li {
    list-style-type: none;
    padding: 0 20px;
    position: relative;
  }
  .header-list-nav ul a {
    text-decoration: none;
    font-size: 16px;
    font-weight: 600;
    color: #1a1a1a;
    transition: 0.3s ease;
  }
  .header-list-nav ul a:hover,
  .header-list-nav ul a.active {
    color: #088178;
    content: "";
  }
  .header-list-icon a {
    color: #1a1a1a;
    padding-left: 20px;
    transition: 0.3s ease;
  }
  .header-list-icon a:hover,
  .header-list-nav ul a.active {
    color: #088178;
  }
  .header-list-nav ul li a:hover::after,
  .header-list-nav ul li a.active::after {
    content: "";
    width: 30%;
    height: 2px;
    background: #088178;
    position: absolute;
    bottom: -4px;
    left: 20px;
  }


  
  *{
        font-family: "League Spartan", sans-serif;
        padding: 0px;
        margin: 0px;
    }
  /* Container to hold both image and form sections */
.container {
  display: flex;
  height: 98vh;
  background-color: #e3e6f3;
}

/* Image Section */
.image-section {
  width: 60%;
  background-color: #e3e6f3;
  display: flex;
  justify-content: center;
  align-items: center;
}

.image-section img {
  max-width: 100%;
  max-height: 90%;
  object-fit: cover;
}

/* Form Section */
.form-container {
  width: 320px;
  height: 40%;
  margin-top: 15%;
  margin-left: 3%;
  border-radius: 0.75rem;
  background-color: rgba(17, 24, 39, 1);
  padding: 2rem;
  color: rgba(243, 244, 246, 1);
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.title {
  text-align: center;
  font-size: 1.5rem;
  line-height: 2rem;
  font-weight: 700;
}

.form {
  margin-top: 1.5rem;
}

.input-group {
  margin-top: 0.25rem;
  font-size: 0.875rem;
  line-height: 1.25rem;
}

.input-group label {
  display: block;
  color: rgba(156, 163, 175, 1);
  margin-bottom: 4px;
}

.input-group input {
  width: 90%;
  border-radius: 0.375rem;
  border: 1px solid rgba(55, 65, 81, 1);
  outline: 0;
  background-color: rgba(17, 24, 39, 1);
  padding: 0.75rem 1rem;
  color: rgba(243, 244, 246, 1);
}

.input-group input:focus {
  border-color: rgba(167, 139, 250);
}

.forgot {
  display: flex;
  justify-content: flex-end;
  font-size: 0.75rem;
  line-height: 1rem;
  color: rgba(156, 163, 175,1);
  margin: 8px 0 14px 0;
}

.forgot a, .signup a {
  color: rgba(243, 244, 246, 1);
  text-decoration: none;
  font-size: 14px;
}

.forgot a:hover, .signup a:hover {
  text-decoration: underline rgba(167, 139, 250, 1);
}

.sign {
  display: block;
  width: 100%;
  background-color: rgba(167, 139, 250, 1);
  padding: 0.75rem;
  text-align: center;
  color: rgb(27, 17, 39);
  border: none;
  border-radius: 0.375rem;
  font-weight: 600;
}

.signup {
  text-align: center;
  font-size: 0.75rem;
  line-height: 1rem;
  color: rgba(156, 163, 175, 1);
}
